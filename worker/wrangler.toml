name = "focus-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Browsers allowed to call this API (comma separated). The sync key is still required.
ALLOWED_ORIGINS = "https://akhwave.github.io,http://localhost:8810"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
